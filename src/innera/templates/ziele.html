{% extends "base.html" %}

{% block content %}
<header class="page-head">
  <p class="tag">Über die Zeit</p>
  <h1>Ziele</h1>
  <p>Karriere und Beziehung. Der Fortschritt kommt aus deinen Check-ups.</p>
</header>
<div id="goal-list" class="stack"></div>
<form id="goal-form" class="panel">
  <h2>Ziel setzen</h2>
  <div class="choices" role="group" aria-label="Bereiche">
    {% for area in areas %}
    <label class="choice">
      <input type="checkbox" name="area" value="{{ area }}">
      <span>{{ area }}</span>
    </label>
    {% endfor %}
  </div>
  <label class="field">Optional: ein Satz dazu
    <input name="goal" type="text" placeholder="Zum Beispiel ein Gespräch vorbereiten" autocomplete="off">
  </label>
  <p id="goal-hint" class="form-hint" hidden>Wähl mindestens einen Bereich.</p>
  <button type="submit">Speichern</button>
</form>
{% endblock %}

{% block scripts %}
<script src="/static/store.js?v=3"></script>
<script src="/static/goals.js?v=3"></script>
{% endblock %}
